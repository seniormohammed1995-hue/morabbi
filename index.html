<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#B4532A" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1E1915" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="طيور في بيتي: دليلك لتربية الفراخ والحمام والبط والأوز والرومي والسمان في البيت في مصر — خطة يوم بيوم وتنبيهات الجو، وبيشتغل من غير نت." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>طيور في بيتي</title>
    <script>
      try {
        var t = localStorage.getItem('morabbi-theme')
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>التطبيق محتاج تفعيل JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
