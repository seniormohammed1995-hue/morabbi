name: Build Android APK

# Builds morabbi-v3.apk with Capacitor and attaches it to a GitHub Release.
# Run it by pushing a tag (git tag v3.0.0 && git push origin v3.0.0) or from the Actions tab.
# The web app's "حمّل نسخة الأندرويد" button points at releases/latest/download/morabbi-v3.apk.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  APK_NAME: morabbi-v3.apk

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - run: npm ci
      - run: npm test

      # Capacitor serves the app from the root, so no BASE_PATH here.
      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: |
          npx cap add android
          npx --yes @capacitor/assets@4.0.0 generate --android \
            --iconBackgroundColor '#FBF5EA' --iconBackgroundColorDark '#2A1F17' \
            --splashBackgroundColor '#FBF5EA' --splashBackgroundColorDark '#2A1F17'
          mkdir -p android/app/src/main/res/drawable
          cp resources/android/ic_stat_tuyuri.xml android/app/src/main/res/drawable/
          npx cap sync android

      - name: Set version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      # With the signing secrets every APK has the same signature, so users can update
      # in place. Without them a debug APK is built (installable, but each build is signed
      # differently, so updating means uninstalling first). See ANDROID.md.
      - name: Build signed release APK
        if: ${{ env.HAS_KEY == 'true' }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          (cd android && ./gradlew --no-daemon assembleRelease)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD --out "$APK_NAME" aligned.apk
          "$BT/apksigner" verify "$APK_NAME"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Build debug APK (no signing secrets)
        if: ${{ env.HAS_KEY != 'true' }}
        run: |
          echo "::warning::ANDROID_KEYSTORE_BASE64 is not set — building a debug-signed APK. Users must uninstall before updating to a later build. See ANDROID.md."
          (cd android && ./gradlew --no-daemon assembleDebug)
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', env.VERSION) }}
          name: طيور في بيتي ${{ env.VERSION }}
          make_latest: 'true'
          files: ${{ env.APK_NAME }}
          body: |
            نسخة الأندرويد من **طيور في بيتي** ${{ env.VERSION }}.

            **التثبيت:** حمّل `${{ env.APK_NAME }}` من الموبايل ← افتحه ← لو قال "مصدر غير معروف" فعّل "السماح من المصدر ده" ← تثبيت.

            التغييرات في [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/CHANGELOG.md).
